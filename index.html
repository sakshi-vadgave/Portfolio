        const { useState, useEffect, useRef } = React;

        // Custom Intersection Observer Hook
        const Reveal = ({ children, delay = 0, direction = "up", className = "" }) => {
            const [isVisible, setIsVisible] = useState(false);
            const ref = useRef(null);

            useEffect(() => {
                const observer = new IntersectionObserver(
                    ([entry]) => {
                        if (entry.isIntersecting) {
                            setIsVisible(true);
                            observer.unobserve(entry.target);
                        }
                    },
                    { threshold: 0.1, rootMargin: "0px 0px -50px 0px" }
                );

                if (ref.current) observer.observe(ref.current);
                return () => observer.disconnect();
            }, []);

            let transformClass = 'translate-y-10';
            if (direction === 'left') transformClass = '-translate-x-10';
            if (direction === 'right') transformClass = 'translate-x-10';
            if (direction === 'scale') transformClass = 'scale-75';

            return (
                <div 
                    ref={ref} 
                    className={`transition-all duration-1000 ease-[cubic-bezier(0.17,0.55,0.55,1)] ${isVisible ? 'opacity-100 translate-y-0 translate-x-0 scale-100' : `opacity-0 ${transformClass}`} ${className}`}
                    style={{ transitionDelay: `${delay}s` }}
                >
                    {children}
                </div>
            );
        };

                if (insights[projectIndex]) return; 
                
                setLoadingInsight(projectIndex);
               // Add Gemini key to use
              const url = "/api/chat";
                const delays = [1000, 2000, 4000, 8000, 16000];
                
                const payload = {
                    contents: [{ parts: [{ text: `You are an expert AI recruiter analyzing a student's portfolio. Project Title: ${projectTitle}. Description: ${projectDesc}. Tech Stack: ${projectTech.join(', ')}. Provide a single, punchy, inspiring sentence explaining the real-world value or potential of this specific project. Limit response to 1 sentence.` }] }]

                        const response = await fetch(url, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(payload)
                        });

                setActiveIndex((prev) => (prev - 1 + achievementsJourneyData.length) % achievementsJourneyData.length);
            };

            // Mobile Swipe Support
            const handleTouchStart = (e) => setTouchStart(e.targetTouches[0].clientX);
            const handleTouchEnd = (e) => {
                if (!touchStart) return;
                const touchEnd = e.changedTouches[0].clientX;
                if (touchStart - touchEnd > 50) handleNext(); // swipe left
                if (touchStart - touchEnd < -50) handlePrev(); // swipe right
                setTouchStart(null);
            };

            return (
                <section id="achievements" className="py-24 md:py-32 relative z-10 bg-[#070A12] overflow-hidden">
                    {/* Cinematic Background Elements */}
                    <div className="absolute top-0 left-1/4 w-px h-full bg-gradient-to-b from-transparent via-purple/10 to-transparent"></div>
                    <div className="absolute top-0 right-1/4 w-px h-full bg-gradient-to-b from-transparent via-cyan/10 to-transparent"></div>
                    
                    {/* Floating subtle stars/particles */}
                    <div className="absolute inset-0 pointer-events-none" style={{ backgroundImage: 'radial-gradient(circle at center, white 1px, transparent 1px)', backgroundSize: '100px 100px', opacity: 0.03 }}></div>
                    <div className="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[800px] h-[600px] bg-purple/20 rounded-full blur-[120px] opacity-20 mix-blend-screen pointer-events-none"></div>

                    <div className="max-w-[90rem] mx-auto px-4 sm:px-6 relative z-20">
                        <SectionHeading title="Milestones That Shaped Me" subtitle={true} />
                        
                        <Reveal>
                            <div className="relative w-full h-[650px] md:h-[550px] mt-12 md:mt-20 flex items-center justify-center perspective-[2000px]"
                                onTouchStart={handleTouchStart}
                                onTouchEnd={handleTouchEnd}
                            >
                                {achievementsJourneyData.map((item, index) => {
                                    // Calculate circular relative offset (-1: prev, 0: active, 1: next)
                                    let offset = index - activeIndex;
                                    const len = achievementsJourneyData.length;
                                    if (offset > len / 2) offset -= len;
                                    if (offset < -len / 2) offset += len;

                                    // 👇 FIXED FRAME SIZE APPLIED HERE (h-[600px] md:h-[500px]) 👇
                                    let containerClasses = "absolute transition-all duration-1000 ease-[cubic-bezier(0.23,1,0.32,1)] w-full max-w-sm md:max-w-5xl h-[600px] md:h-[500px] rounded-[2rem] overflow-hidden glass-card border border-white/10 flex flex-col md:flex-row shadow-2xl bg-dark/80 backdrop-blur-2xl";
                                    let zIndex = 20 - Math.abs(offset);
                                    
                                    if (offset === 0) {
                                        // ACTIVE CARD
                                        containerClasses += " z-30 scale-100 opacity-100 translate-x-0 translate-y-0 blur-none border-purple/40 shadow-[0_30px_80px_-15px_rgba(139,92,246,0.3)]";
                                    } else if (offset === -1) {
                                        // PREVIOUS CARD
                                        containerClasses += " z-20 scale-[0.85] opacity-40 -translate-x-[30%] md:-translate-x-[45%] -translate-y-4 blur-[4px] cursor-pointer hover:opacity-60 hover:blur-[2px]";
                                    } else if (offset === 1) {
                                        // NEXT CARD
                                        containerClasses += " z-20 scale-[0.85] opacity-40 translate-x-[30%] md:translate-x-[45%] -translate-y-4 blur-[4px] cursor-pointer hover:opacity-60 hover:blur-[2px]";
                                    } else {
                                        // HIDDEN CARDS
                                        containerClasses += " z-10 scale-75 opacity-0 pointer-events-none blur-xl -translate-y-8";
                                        if (offset < 0) containerClasses += " -translate-x-[60%]";
                                        if (offset > 0) containerClasses += " translate-x-[60%]";
                                    }

                                    return (
                                        <div 
                                            key={index} 
                                            className={containerClasses} 
                                            style={{ zIndex }}
                                            onClick={() => {
                                                if (offset === -1) handlePrev();
                                                if (offset === 1) handleNext();
                                            }}
                                        >
                                            {/* LEFT SIDE: Image Container */}
                                            <div className="relative w-full md:w-[45%] h-[280px] md:h-full overflow-hidden group bg-black shrink-0">
                                                {/* 👇 object-center ensures the middle of the image is never cut off 👇 */}
                                                <img 
                                                    src={item.image} 
                                                    alt={item.title} 
                                                    className={`w-full h-full object-cover object-center transition-transform duration-1000 ease-out ${offset === 0 ? 'group-hover:scale-110' : ''}`}
                                                />
                                                {/* Premium Dark Gradients for blending */}
                                                <div className="absolute inset-0 bg-gradient-to-t from-dark/90 via-dark/20 to-transparent"></div>
                                                <div className="absolute inset-0 bg-gradient-to-r from-transparent via-transparent to-dark/95 hidden md:block"></div>
                                                
                                                {/* Category Badge overlaying the image */}
                                                <div className="absolute top-6 left-6 z-20 px-4 py-1.5 bg-black/40 backdrop-blur-md rounded-full text-xs font-semibold tracking-wide text-white border border-white/20 shadow-lg">
                                                    {item.category}
                                                </div>
                                            </div>
                                            
                                            {/* RIGHT SIDE: Content */}
                                            <div className="relative w-full md:w-[55%] p-6 md:p-12 flex flex-col justify-center bg-dark/40 flex-grow">
                                                {/* Decorative Icon */}
                                                <div className="absolute top-8 right-8 w-12 h-12 bg-gradient-to-br from-purple/20 to-cyan/20 rounded-full flex items-center justify-center text-cyan shadow-[0_0_20px_rgba(6,182,212,0.3)] hidden md:flex border border-cyan/30">
                                                    <Icons.Trophy />
                                                </div>

                                                <div className="flex flex-col gap-1 mb-6">
                                                    <h3 className="text-2xl md:text-4xl font-outfit font-bold text-white leading-tight">
                                                        {item.title}
                                                    </h3>
                                                    <p className="text-lg md:text-xl font-medium text-transparent bg-clip-text bg-gradient-to-r from-purple to-cyan mt-1">
                                                        {item.event}
                                                    </p>
                                                </div>

                                                <div className="flex items-center gap-4 mb-6 text-xs md:text-sm text-textMuted font-medium">
                                                    <span className="flex items-center gap-1.5 bg-white/5 px-3 py-1.5 rounded-md border border-white/10">
                                                        <svg className="w-4 h-4 text-cyan" fill="none" stroke="currentColor" viewBox="0 0 24 24"><rect width="18" height="18" x="3" y="4" rx="2" ry="2"/><line x1="16" x2="16" y1="2" y2="6"/><line x1="8" x2="8" y1="2" y2="6"/><line x1="3" x2="21" y1="10" y2="10"/></svg>
                                                        {item.date}
                                                    </span>
                                                    <span className="flex items-center gap-1.5 bg-white/5 px-3 py-1.5 rounded-md border border-white/10">
                                                        <svg className="w-4 h-4 text-purple" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>
                                                        {item.location}
                                                    </span>
                                                </div>

                                                <p className="text-sm md:text-base text-textMuted leading-relaxed mb-8 flex-grow">
                                                    {item.desc}
                                                </p>

                                                {/* Tags */}
                                                <div className="flex flex-wrap gap-2 mt-auto">
                                                    {item.tags.map((tag, i) => (
                                                        <span key={i} className="px-3 py-1 rounded-full text-xs font-medium bg-white/5 text-white/80 border border-white/10">
                                                            #{tag}
                                                        </span>
                                                    ))}
                                                </div>
                                            </div>
                                        </div>
                                    );
                                })}
                            </div>

                            {/* Elegant Cinematic Controls */}
                            <div className="flex justify-center items-center gap-8 mt-12 md:mt-20">
                                <button 
                                    onClick={handlePrev}
                                    className="w-14 h-14 rounded-full border border-white/10 bg-white/5 flex items-center justify-center text-white hover:bg-white/10 hover:border-purple/50 transition-all duration-300 hover:scale-110 active:scale-95 shadow-lg group"
                                >
                                    <span className="transform group-hover:-translate-x-1 transition-transform">
                                        <Icons.ChevronLeft />
                                    </span>
                                </button>
                                
                                {/* Pagination Indicator */}
                                <div className="flex gap-3">
                                    {achievementsJourneyData.map((_, i) => (
                                        <button 
                                            key={i}
                                            onClick={() => setActiveIndex(i)}
                                            className={`h-1.5 rounded-full transition-all duration-500 ease-out ${i === activeIndex ? 'w-10 bg-gradient-to-r from-purple to-cyan shadow-[0_0_15px_rgba(6,182,212,0.8)]' : 'w-2 bg-white/20 hover:bg-white/40 hover:scale-150'}`}
                                            aria-label={`Go to slide ${i + 1}`}
                                        />
                                    ))}
                                </div>

                                <button 
                                    onClick={handleNext}
                                    className="w-14 h-14 rounded-full border border-white/10 bg-white/5 flex items-center justify-center text-white hover:bg-white/10 hover:border-cyan/50 transition-all duration-300 hover:scale-110 active:scale-95 shadow-lg group"
                                >
                                    <span className="transform group-hover:translate-x-1 transition-transform">
                                        <Icons.ChevronRight />
                                    </span>
                                </button>
                            </div>
                        </Reveal>
                    </div>
                </section>
            );
        };

        const Leadership = () => {
            return (
                <section className="py-24 relative z-10">
                    <div className="max-w-6xl mx-auto px-6">
                        <SectionHeading title="Beyond Technology" subtitle={true} />
                        
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                            {leadershipData.map((item, index) => (
                                <Reveal key={index} direction="scale" delay={index * 0.1}>
                                    <div className="glass-card p-8 rounded-3xl flex gap-6 items-start group hover:border-purple/30 transition-all duration-300 h-full">
                                        <div className="w-12 h-12 shrink-0 rounded-full bg-purple/10 flex items-center justify-center text-purple group-hover:bg-purple group-hover:text-white transition-colors duration-300">
                                            <Icons.Star />
                                        </div>
                                        <div>
                                            <h3 className="text-xl font-outfit font-bold text-white mb-2">{item.title}</h3>
                                            <p className="text-textMuted leading-relaxed">{item.desc}</p>
                                        </div>
                                    </div>
                                </Reveal>
                            ))}
                        </div>
                    </div>
                </section>
            );
        };

        const Contact = () => {
            return (
                <section id="contact" className="py-24 relative z-10 bg-black/40 border-t border-white/5">
                    <div className="absolute inset-0 bg-[url('data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iNjAiIGhlaWdodD0iNjAiIHhtbG5zPSJodHRwOi8vd3d3LnczLm9yZy8yMDAwL3N2ZyI+PGNpcmNsZSBjeD0iMCIgY3k9IjAiIHI9IjEiIGZpbGw9InJnYmEoMjU1LDI1NSwyNTUsMC4wNSkiLz48L3N2Zz4=')] opacity-50"></div>
                    
                    <div className="max-w-4xl mx-auto px-6 relative z-10 text-center">
                        <Reveal>
                            <div className="glass-card p-10 md:p-16 rounded-3xl border-purple/20 relative overflow-hidden">
                                <div className="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-64 h-64 bg-cyan/10 rounded-full blur-[80px]"></div>
                                
                                <h2 className="text-3xl md:text-5xl font-outfit font-bold text-white mb-6">Want to know more about my journey?</h2>
                                <p className="text-lg text-textMuted mb-10 max-w-2xl mx-auto">
                                    Open to learning opportunities, collaborations, and innovative experiences. Let's connect and build something amazing together.
                                </p>
                                
                                <div className="flex flex-col sm:flex-row justify-center items-center gap-4 mb-12">
                                    {/* 👇 PUT YOUR RESUME FILE NAME HERE 👇 */}
                                    <a href="Resume.pdf" target="_blank" className="w-full sm:w-auto px-8 py-4 bg-white/10 text-white rounded-xl font-medium border border-white/10 hover:bg-white/20 transition-all duration-300 flex items-center justify-center gap-2">
                                        <Icons.Download /> Download Resume
                                    </a>
                                    
                                    {/* 👇 PUT YOUR EMAIL HERE 👇 */}
                                    <a href="mailto:vadgavesakshi8@gmail.com" className="w-full sm:w-auto px-8 py-4 bg-gradient-to-r from-purple to-cyan text-white rounded-xl font-medium shadow-lg shadow-purple/25 hover:shadow-cyan/25 transition-all duration-300 transform hover:-translate-y-1 flex items-center justify-center gap-2">
                                        <Icons.Mail /> Email Me
                                    </a>
                                </div>
                                
                                <div className="flex items-center justify-center gap-8 border-t border-white/10 pt-8">
                                    {/* 👇 PUT YOUR GITHUB PROFILE LINK HERE 👇 */}
                                    <a href="https://github.com/sakshi-vadgave" target="_blank" className="text-textMuted hover:text-white transition-colors flex items-center gap-2">
                                        <Icons.Github /> <span className="hidden sm:inline">GitHub</span>
                                    </a>
                                    
                                    {/* 👇 PUT YOUR LINKEDIN PROFILE LINK HERE 👇 */}
                                    <a href="https://www.linkedin.com/in/sakshi-vadgave-554505357?utm_source=share_via&utm_content=profile&utm_medium=member_android" target="_blank" className="text-textMuted hover:text-cyan transition-colors flex items-center gap-2">
                                        <Icons.Linkedin /> <span className="hidden sm:inline">LinkedIn</span>
                                    </a>
                                </div>
                            </div>
                        </Reveal>
                    </div>
                </section>
            );
        };

        const Footer = () => (
            <footer className="py-8 bg-dark border-t border-white/5 text-center relative z-10">
                <p className="text-textMuted text-sm font-outfit">
                    Designed & Developed by <span className="text-white font-medium">Sakshi Sunil Vadgave</span> &copy; 2026
                </p>
            </footer>
        );

        const App = () => {
            return (
                <div className="relative">
                    <Navbar />
                    <Hero />
                    <About />
                    <Skills />
                    <Projects />
                    <AchievementsJourney />
                    <Leadership />
                    <Contact />
                    <Footer />
                </div>
            );
        };

        // Render the app
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
